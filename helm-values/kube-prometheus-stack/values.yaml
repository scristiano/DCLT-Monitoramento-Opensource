# =============================================================================
# KUBE-PROMETHEUS-STACK VALUES
# =============================================================================
# Aula 07 - PosTech DevOps - Observabilidade no Kubernetes
# Configuração para kube-prometheus-stack (Prometheus + Grafana + AlertManager)
#
# Versões testadas:
# - Helm Chart: 77.x+ (prometheus-community/kube-prometheus-stack)
# - Kubernetes: 1.34
# - Prometheus Operator: 0.78.x+
# - Grafana: 11.x+
#
# Instalação:
# helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#   --namespace monitoring --create-namespace \
#   --values helm-values/kube-prometheus-stack/values.yaml
# =============================================================================

# Configurações globais
fullnameOverride: ""
nameOverride: ""

# =============================================================================
# PROMETHEUS CONFIGURATION
# =============================================================================
prometheus:
  enabled: true
  
  prometheusSpec:
    # External URL e route prefix
    externalUrl: http://prometheus.demo.lynxnetwork.com.br
    routePrefix: /
    
    # Recursos computacionais
    resources:
      requests:
        memory: 1Gi
        cpu: 500m
      limits:
        memory: 2Gi
        cpu: 1000m
    
    # Storage persistente
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    
    # Retenção de dados
    retention: 7d
    retentionSize: 10GB
    
    # Configurações de scraping
    scrapeInterval: 30s
    evaluationInterval: 30s
    
    # Service discovery
    serviceDiscoveryNamespaceSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}
    ruleNamespaceSelector: {}
    
    # Configurações de segurança
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      fsGroup: 65534
    
    # Configurações de rede
    portName: web
    
  # Service configuration
  service:
    type: ClusterIP
    port: 9090
    targetPort: 9090
    
  # Ingress configuration - DESABILITADO (usando Ingress centralizado)
  # Ver: kubernetes/eks-lab-ingress.yaml
  ingress:
    enabled: false
grafana:
  enabled: true
  
  # Credenciais de admin
  adminPassword: admin123
  
  # Recursos computacionais
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 200m
  
  # Storage persistente
  persistence:
    enabled: true
    storageClassName: gp3
    size: 10Gi
    accessModes:
      - ReadWriteOnce
  
  # Service configuration
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000
  
  # Configurações do Grafana
  grafana.ini:
    server:
      root_url: "http://grafana.demo.lynxnetwork.com.br/"
      serve_from_sub_path: false
    security:
      allow_embedding: true
    auth.anonymous:
      enabled: false
      org_role: Viewer

  # Configurações de data sources (automático via sidecar)
  sidecar:
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard
      labelValue: "1"
  
  # Adicionar datasources adicionais
  additionalDataSources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki-gateway.monitoring.svc.cluster.local
    isDefault: false
    editable: true
  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger.monitoring.svc.cluster.local:16686
    isDefault: false
    editable: true
    jsonData:
      tracesToLogsV2:
        datasourceUid: 'loki'
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
        filterByTraceID: true
        filterBySpanID: false
      tracesToMetrics:
        datasourceUid: 'prometheus'
      nodeGraph:
        enabled: true
  
  # Dashboards pré-configurados
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default
      - name: 'observability'
        orgId: 1
        folder: 'Observability'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/observability

  dashboards:
    observability:
      # Dashboard de logs do Loki
      loki-logs:
        gnetId: 13639
        revision: 2
        datasource: Loki
      # Dashboard oficial do Loki (métricas operacionais)
      loki-metrics:
        gnetId: 13407
        revision: 1
        datasource: Prometheus
      # Dashboard de logs do Kubernetes
      kubernetes-cluster-logs:
        gnetId: 15141
        revision: 1
        datasource: Loki
  
  # Configurações de segurança
  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    fsGroup: 472
  
  # Plugins adicionais
  plugins:
    - grafana-piechart-panel
    - grafana-worldmap-panel

  # Ingress configuration - DESABILITADO (usando Ingress centralizado)
  # Ver: kubernetes/eks-lab-ingress.yaml
  ingress:
    enabled: false

# =============================================================================
# ALERTMANAGER CONFIGURATION
# =============================================================================
alertmanager:
  enabled: true

# =============================================================================
# NODE EXPORTER CONFIGURATION
# =============================================================================
nodeExporter:
  enabled: true
  
  # Recursos computacionais
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m

# =============================================================================
# KUBE STATE METRICS CONFIGURATION
# =============================================================================
kubeStateMetrics:
  enabled: true
  
  # Recursos computacionais
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 100m

# =============================================================================
# PROMETHEUS OPERATOR CONFIGURATION
# =============================================================================
prometheusOperator:
  enabled: true
  
  # Recursos computacionais
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 100m
  
  # Configurações de admissão
  admissionWebhooks:
    enabled: true
    patch:
      enabled: true

# =============================================================================
# ADDITIONAL CONFIGURATIONS
# =============================================================================

# Configurações de RBAC
rbac:
  create: true

# Service accounts
serviceAccount:
  create: true

# Configurações de namespace
namespaceOverride: "monitoring"

# Labels comuns
commonLabels:
  app.kubernetes.io/part-of: observability-stack
  course: postech-devops
  class: aula-07