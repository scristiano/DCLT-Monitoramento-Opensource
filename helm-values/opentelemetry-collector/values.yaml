# =============================================================================
# OPENTELEMETRY COLLECTOR VALUES - Centralizado
# =============================================================================
# Aula 08 - PosTech DevOps - OpenTelemetry Collector Centralizado
# Collector centralizado que recebe telemetria de todas as aplicações
# e exporta para múltiplos backends (Jaeger, Prometheus, Loki)
#
# Versões testadas:
# - Helm Chart: 0.x+ (open-telemetry/opentelemetry-collector)
# - Kubernetes: 1.34
#
# Instalação:
# helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
# helm repo update
# helm upgrade --install otel-collector open-telemetry/opentelemetry-collector \
#   --namespace monitoring --create-namespace \
#   --values helm-values/opentelemetry-collector/values.yaml
# =============================================================================

# =============================================================================
# MODE
# =============================================================================
# deployment: Collector centralizado (stateless)
# daemonset: Agent em cada node (para logs e métricas de host)
# statefulset: Para processamento com estado
mode: deployment

# =============================================================================
# REPLICAS
# =============================================================================
replicaCount: 2

# =============================================================================
# IMAGE
# =============================================================================
image:
  repository: otel/opentelemetry-collector-k8s

# =============================================================================
# RESOURCES
# =============================================================================
resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 200m
    memory: 400Mi

# =============================================================================
# SERVICE
# =============================================================================
service:
  type: ClusterIP
  ports:
    # OTLP gRPC receiver
    otlp:
      enabled: true
      containerPort: 4317
      servicePort: 4317
      protocol: TCP
    # OTLP HTTP receiver
    otlp-http:
      enabled: true
      containerPort: 4318
      servicePort: 4318
      protocol: TCP
    # Jaeger gRPC receiver (legacy)
    jaeger-grpc:
      enabled: true
      containerPort: 14250
      servicePort: 14250
      protocol: TCP
    # Jaeger thrift HTTP receiver (legacy)
    jaeger-thrift:
      enabled: true
      containerPort: 14268
      servicePort: 14268
      protocol: TCP
    # Zipkin receiver
    zipkin:
      enabled: true
      containerPort: 9411
      servicePort: 9411
      protocol: TCP
    # Prometheus metrics exporter
    metrics:
      enabled: true
      containerPort: 8888
      servicePort: 8888
      protocol: TCP

# =============================================================================
# SERVICE MONITOR (Prometheus)
# =============================================================================
serviceMonitor:
  enabled: true
  extraLabels:
    release: kube-prometheus-stack

# =============================================================================
# PORTS (Exposição adicional)
# =============================================================================
ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    hostPort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  jaeger-grpc:
    enabled: true
    containerPort: 14250
    servicePort: 14250
    protocol: TCP
  jaeger-thrift:
    enabled: true
    containerPort: 14268
    servicePort: 14268
    protocol: TCP
  zipkin:
    enabled: true
    containerPort: 9411
    servicePort: 9411
    protocol: TCP
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888
    protocol: TCP

# =============================================================================
# OPENTELEMETRY COLLECTOR CONFIGURATION
# =============================================================================
config:
  # ===========================================================================
  # RECEIVERS - Recebem telemetria de aplicações
  # ===========================================================================
  receivers:
    # OTLP receiver (padrão OpenTelemetry)
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
          cors:
            allowed_origins:
              - "*"
    
    # Jaeger receiver (legacy - compatibilidade)
    jaeger:
      protocols:
        grpc:
          endpoint: 0.0.0.0:14250
        thrift_http:
          endpoint: 0.0.0.0:14268
    
    # Zipkin receiver (compatibilidade)
    zipkin:
      endpoint: 0.0.0.0:9411
    
    # Prometheus receiver (scrape próprias métricas)
    prometheus:
      config:
        scrape_configs:
          - job_name: 'otel-collector'
            scrape_interval: 30s
            static_configs:
              - targets: ['localhost:8888']
  
  # ===========================================================================
  # PROCESSORS - Processam e transformam telemetria
  # ===========================================================================
  processors:
    # Batch processor - agrupa telemetria para envio eficiente
    batch:
      timeout: 10s
      send_batch_size: 1024
    
    # Memory limiter - previne OOM
    memory_limiter:
      check_interval: 5s
      limit_mib: 1536
      spike_limit_mib: 512
    
    # Resource processor - adiciona atributos de recurso
    resource:
      attributes:
        - key: cluster.name
          value: eks-lab
          action: upsert
        - key: environment
          value: lab
          action: upsert
    
    # Attributes processor - manipula atributos de spans
    attributes:
      actions:
        - key: k8s.cluster.name
          value: eks-lab
          action: upsert
  
  # ===========================================================================
  # EXPORTERS - Enviam telemetria para backends
  # ===========================================================================
  exporters:
    # Exportar traces para Jaeger
    otlp/jaeger:
      endpoint: jaeger-collector.monitoring.svc.cluster.local:4317
      tls:
        insecure: true
    
    # Exportar métricas para Prometheus
    prometheus:
      endpoint: 0.0.0.0:8888
      resource_to_telemetry_conversion:
        enabled: true
    
    # Exportar logs para Loki
    loki:
      endpoint: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
      labels:
        resource:
          cluster: "cluster.name"
          namespace: "k8s.namespace.name"
          pod: "k8s.pod.name"
          container: "k8s.container.name"
    
    # Debug exporter (troubleshooting)
    debug:
      verbosity: detailed
      sampling_initial: 5
      sampling_thereafter: 200
  
  # ===========================================================================
  # EXTENSIONS - Funcionalidades adicionais
  # ===========================================================================
  extensions:
    # Health check endpoint
    health_check:
      endpoint: 0.0.0.0:13133
    
    # pprof para profiling
    pprof:
      endpoint: 0.0.0.0:1777
    
    # zpages para debugging
    zpages:
      endpoint: 0.0.0.0:55679
  
  # ===========================================================================
  # SERVICE - Define pipelines de processamento
  # ===========================================================================
  service:
    extensions: [health_check, pprof, zpages]
    
    pipelines:
      # Pipeline de traces
      traces:
        receivers: [otlp, jaeger, zipkin]
        processors: [memory_limiter, resource, attributes, batch]
        exporters: [otlp/jaeger, debug]
      
      # Pipeline de métricas
      metrics:
        receivers: [otlp, prometheus]
        processors: [memory_limiter, resource, batch]
        exporters: [prometheus, debug]
      
      # Pipeline de logs
      logs:
        receivers: [otlp]
        processors: [memory_limiter, resource, batch]
        exporters: [loki, debug]

# =============================================================================
# AUTOSCALING
# =============================================================================
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# =============================================================================
# POD DISRUPTION BUDGET
# =============================================================================
podDisruptionBudget:
  enabled: true
  minAvailable: 1
