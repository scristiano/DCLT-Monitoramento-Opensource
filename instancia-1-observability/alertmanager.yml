# =============================================================================
# ALERTMANAGER CONFIGURATION
# =============================================================================
# Configuração do Alertmanager para gerenciamento de alertas
# Documentação: https://prometheus.io/docs/alerting/latest/configuration/
# =============================================================================

global:
  # Tempo de resolução padrão para alertas
  resolve_timeout: 5m
  
  # Configuração SMTP (descomente e configure para enviar emails)
  # smtp_smarthost: 'smtp.gmail.com:587'
  # smtp_from: 'alertmanager@example.com'
  # smtp_auth_username: 'your-email@gmail.com'
  # smtp_auth_password: 'your-app-password'

# Template files para customizar notificações
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Rota principal de alertas
route:
  # Agrupamento de alertas
  group_by: ['alertname', 'cluster', 'service']
  
  # Tempo de espera antes de enviar notificação de um novo grupo
  group_wait: 10s
  
  # Tempo de espera antes de enviar notificação sobre novos alertas no grupo
  group_interval: 10s
  
  # Tempo mínimo entre reenvios de alertas
  repeat_interval: 12h
  
  # Receptor padrão
  receiver: 'default'
  
  # Rotas específicas por tipo de alerta
  routes:
    # Alertas críticos
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
    
    # Alertas de warning
    - match:
        severity: warning
      receiver: 'warning-alerts'
      continue: true
    
    # Alertas de aplicações
    - match_re:
        service: '(frontend|backend)-service'
      receiver: 'app-alerts'

# Inibição de alertas (evita spam)
inhibit_rules:
  # Se um alerta crítico está ativo, não enviar warnings relacionados
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']

# Receptores de alertas
receivers:
  # Receptor padrão (apenas log)
  - name: 'default'
