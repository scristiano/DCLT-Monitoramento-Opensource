# =============================================================================
# GRAFANA DASHBOARDS PROVISIONING
# =============================================================================
# Configuração automática de dashboards no Grafana
# Este arquivo define onde o Grafana deve buscar os dashboards JSON
#
# Documentação: https://grafana.com/docs/grafana/latest/administration/provisioning/#dashboards
# =============================================================================

apiVersion: 1

providers:
  # Provider para dashboards de aplicações
  - name: 'Application Dashboards'
    orgId: 1
    folder: 'Applications'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/applications
      foldersFromFilesStructure: false

  # Provider para dashboards de infraestrutura
  - name: 'Infrastructure Dashboards'
    orgId: 1
    folder: 'Infrastructure'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/infrastructure
      foldersFromFilesStructure: false

  # Provider para dashboards de overview
  - name: 'Overview Dashboards'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/overview
      foldersFromFilesStructure: false

# =============================================================================
# CONFIGURAÇÕES
# =============================================================================
#
# disableDeletion: false - Permite deletar dashboards via UI
# updateIntervalSeconds: 10 - Verifica mudanças nos arquivos a cada 10s
# allowUiUpdates: true - Permite editar dashboards via UI
#
# ESTRUTURA DE PASTAS:
# - overview/ - Dashboards de visão geral
# - applications/ - Dashboards de aplicações (frontend, backend)
# - infrastructure/ - Dashboards de infraestrutura (OTel Collector, Prometheus)
# =============================================================================
