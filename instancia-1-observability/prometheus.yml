global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'docker-observability'
    replica: '1'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
        labels:
          service: 'otel-collector'

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
        labels:
          service: 'loki'

  - job_name: 'jaeger'
    static_configs:
      - targets: ['jaeger:14269']
        labels:
          service: 'jaeger'

  # Alloy monitoring (Scenario 2 - Instance 2)
  - job_name: 'alloy'
    static_configs:
      - targets: ['INSTANCE_2_IP:12345']
        labels:
          service: 'alloy'
          scenario: 'scenario-2'
          instance: 'instance-2'

remote_write:
  - url: http://localhost:9090/api/v1/write
