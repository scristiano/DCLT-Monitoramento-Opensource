# =============================================================================
# NODEPOOL SYSTEM PATCH - T FAMILY SMALL INSTANCES
# =============================================================================
# Patch para NodePool system do EKS Auto Mode
# Restringe a instâncias pequenas da família T
# =============================================================================

apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: system
spec:
  template:
    spec:
      requirements:
      - key: karpenter.sh/capacity-type
        operator: In
        values:
        - spot
      - key: eks.amazonaws.com/instance-category
        operator: In
        values:
        - t
      - key: eks.amazonaws.com/instance-generation
        operator: Gt
        values:
        - "2"
      - key: eks.amazonaws.com/instance-size
        operator: In
        values:
        - small
        - medium
        - large
      - key: kubernetes.io/arch
        operator: In
        values:
        - amd64
      - key: kubernetes.io/os
        operator: In
        values:
        - linux
