# =============================================================================
# EKS LAB INGRESS - Shared ALB for all services
# =============================================================================
# Ingress único que cria um ALB compartilhado para todos os serviços
# Todas as regras são definidas aqui
# =============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eks-lab-ingress
  namespace: monitoring
  annotations:
    # IngressClass
    kubernetes.io/ingress.class: alb
    
    # Grupo do ALB (permite compartilhar ALB entre namespaces)
    alb.ingress.kubernetes.io/group.name: eks-lab-alb
    
    # Configurações do ALB
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    
    # Certificado ACM (será substituído automaticamente pelo script setup-eks.sh)
    # Para configurar manualmente, obtenha o ARN via:
    # aws acm list-certificates --region us-east-1
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:REGION:ACCOUNT_ID:certificate/CERTIFICATE_ID
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    
    # Health check padrão
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
    
    # Nome do ALB
    alb.ingress.kubernetes.io/load-balancer-name: eks-lab-alb
    
spec:
  ingressClassName: alb
  rules:
  # Grafana
  - host: grafana.demo.lynxnetwork.com.br
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kube-prometheus-stack-grafana
            port:
              number: 80
  
  # Prometheus
  - host: prometheus.demo.lynxnetwork.com.br
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kube-prometheus-stack-prometheus
            port:
              number: 9090


