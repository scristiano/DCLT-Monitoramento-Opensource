# =============================================================================
# NODEPOOL PATCH - T FAMILY INSTANCES ONLY
# =============================================================================
# Patch para NodePool general-purpose do EKS Auto Mode
# Restringe instâncias para família T com Spot
# Limita tamanho máximo para economia
# =============================================================================

apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general-purpose
spec:
  template:
    spec:
      requirements:
      - key: karpenter.sh/capacity-type
        operator: In
        values:
        - spot
      - key: eks.amazonaws.com/instance-category
        operator: In
        values:
        - t
      - key: eks.amazonaws.com/instance-generation
        operator: Gt
        values:
        - "2"
      - key: eks.amazonaws.com/instance-size
        operator: In
        values:
        - nano
        - micro
        - small
        - medium
        - large
        - xlarge
      - key: kubernetes.io/arch
        operator: In
        values:
        - amd64
      - key: kubernetes.io/os
        operator: In
        values:
        - linux
